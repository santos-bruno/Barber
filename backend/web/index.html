<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendamento — Barbearia Sr. Perison</title>
  <style>
    :root {
      --bg: #1a1a1a; --surface: #262626; --primary: #c9a227;
      --text: #f5f5f5; --muted: #b0b0b0; --border: #3a3a3a; --wa: #25D366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      padding: 16px; max-width: 560px; margin: 0 auto;
    }
    header { text-align: center; margin: 20px 0 10px; }
    .logo { font-size: 54px; }
    h1 { font-size: 22px; margin-top: 6px; }
    .addr { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-top: 16px;
    }
    .label {
      color: var(--primary); font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px;
      display: block;
    }
    .services { display: grid; gap: 10px; }
    .service {
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
      cursor: pointer; background: #2d2d2d; transition: .15s;
    }
    .service:hover { border-color: var(--primary); }
    .service.active { border-color: var(--primary); background: #33301f; }
    .service .name { font-weight: 600; }
    .service .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .service .price { color: var(--primary); font-weight: 700; white-space: nowrap; }
    input {
      width: 100%; background: #2d2d2d; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 16px;
    }
    input[type="date"] { color-scheme: dark; }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; }
    .slot {
      border: 1px solid var(--border); background: #2d2d2d; color: var(--text);
      border-radius: 20px; padding: 8px 14px; cursor: pointer; font-size: 15px;
    }
    .slot.active { background: var(--primary); color: #1a1a1a; border-color: var(--primary); font-weight: 700; }
    .hint { color: var(--muted); font-size: 13px; }
    button.cta {
      width: 100%; border: none; border-radius: 12px; padding: 16px;
      font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px;
      background: var(--primary); color: #1a1a1a;
    }
    button.cta:disabled { opacity: .5; cursor: not-allowed; }
    .ok {
      text-align: center; padding: 24px;
    }
    .ok .check { font-size: 56px; }
    .wa-btn {
      display: inline-block; margin-top: 16px; background: var(--wa); color: #fff;
      text-decoration: none; padding: 14px 20px; border-radius: 12px; font-weight: 700;
    }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin: 26px 0 10px; }
    .err { color: #ff6b6b; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">💈</div>
    <h1 id="biz-name">Barbearia e Belezaria Sr. Perison</h1>
    <div class="addr" id="biz-addr"></div>
  </header>

  <div id="form-view">
    <div class="card">
      <span class="label">1. Escolha o serviço</span>
      <div class="services" id="services"><div class="hint">Carregando…</div></div>
    </div>

    <div class="card">
      <span class="label">2. Escolha a data</span>
      <input type="date" id="date" />
    </div>

    <div class="card">
      <span class="label">3. Escolha o horário</span>
      <div class="slots" id="slots"><div class="hint">Selecione um serviço e uma data.</div></div>
    </div>

    <div class="card">
      <span class="label">4. Seus dados</span>
      <input type="text" id="name" placeholder="Seu nome" style="margin-bottom:10px" />
      <input type="tel" id="phone" placeholder="WhatsApp com DDD (ex: 93 99999-9999)" />
    </div>

    <button class="cta" id="submit" disabled>Confirmar agendamento</button>
    <div class="err" id="err"></div>
  </div>

  <div id="ok-view" class="ok card" style="display:none">
    <div class="check">✅</div>
    <h1>Agendamento enviado!</h1>
    <p id="ok-summary" class="hint" style="margin-top:10px"></p>
    <a id="wa-link" class="wa-btn" href="#" target="_blank">Confirmar no WhatsApp</a>
    <div><button class="cta" style="max-width:220px;margin:20px auto 0" onclick="location.reload()">Novo agendamento</button></div>
  </div>

  <footer>Desenvolvido por Bruno</footer>

  <script>
    const API = ''; // mesma origem do site
    let biz = { whatsapp_number: '5593992078226', nome: 'Sr. Perison' };
    let services = [];
    const sel = { service: null, date: null, time: null };

    const $ = (id) => document.getElementById(id);

    function fmtDateBR(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    async function loadInfo() {
      try {
        const r = await fetch(API + '/info');
        const data = await r.json();
        biz = data.estabelecimento || biz;
        $('biz-name').textContent = biz.nome;
        $('biz-addr').textContent = biz.endereco || '';
      } catch (e) {}
    }

    async function loadServices() {
      try {
        const r = await fetch(API + '/services');
        services = await r.json();
        const box = $('services');
        box.innerHTML = '';
        services.forEach((s) => {
          const el = document.createElement('div');
          el.className = 'service';
          el.innerHTML = `<div><div class="name">${s.name}</div>
            <div class="desc">${s.description || ''} · ${s.duration_minutes} min</div></div>
            <div class="price">R$ ${Number(s.price).toFixed(2)}</div>`;
          el.onclick = () => {
            sel.service = s;
            document.querySelectorAll('.service').forEach((e) => e.classList.remove('active'));
            el.classList.add('active');
            loadSlots();
            validate();
          };
          box.appendChild(el);
        });
      } catch (e) {
        $('services').innerHTML = '<div class="err">Não foi possível carregar os serviços.</div>';
      }
    }

    async function loadSlots() {
      const slotsBox = $('slots');
      sel.time = null;
      if (!sel.service || !sel.date) {
        slotsBox.innerHTML = '<div class="hint">Selecione um serviço e uma data.</div>';
        return;
      }
      slotsBox.innerHTML = '<div class="hint">Buscando horários livres…</div>';
      try {
        const r = await fetch(`${API}/appointments/availability?date=${sel.date}&service_id=${sel.service.id}`);
        const data = await r.json();
        if (!data.slots || data.slots.length === 0) {
          slotsBox.innerHTML = '<div class="hint">Sem horários livres nesta data. Tente outro dia.</div>';
          return;
        }
        slotsBox.innerHTML = '';
        data.slots.forEach((t) => {
          const b = document.createElement('div');
          b.className = 'slot';
          b.textContent = t;
          b.onclick = () => {
            sel.time = t;
            document.querySelectorAll('.slot').forEach((e) => e.classList.remove('active'));
            b.classList.add('active');
            validate();
          };
          slotsBox.appendChild(b);
        });
      } catch (e) {
        slotsBox.innerHTML = '<div class="err">Erro ao buscar horários.</div>';
      }
    }

    function validate() {
      const ok = sel.service && sel.date && sel.time && $('name').value.trim();
      $('submit').disabled = !ok;
    }

    async function submit() {
      $('err').textContent = '';
      $('submit').disabled = true;
      const payload = {
        customer_name: $('name').value.trim(),
        phone: $('phone').value.trim(),
        service_id: sel.service.id,
        service_name: sel.service.name,
        date: sel.date,
        time: sel.time + ':00',
        source: 'web',
        notes: '',
      };
      try {
        const r = await fetch(API + '/appointments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (r.status === 409) {
          $('err').textContent = 'Ops, esse horário acabou de ser ocupado. Escolha outro.';
          loadSlots(); validate(); return;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);

        const msg = `Olá Sr. Perison, gostaria de agendar ${sel.service.name} para ${fmtDateBR(sel.date)} às ${sel.time}. (Cliente: ${payload.customer_name})`;
        $('ok-summary').textContent = msg;
        $('wa-link').href = `https://wa.me/${biz.whatsapp_number}?text=${encodeURIComponent(msg)}`;
        $('form-view').style.display = 'none';
        $('ok-view').style.display = 'block';
        window.scrollTo(0, 0);
      } catch (e) {
        $('err').textContent = 'Não foi possível concluir. Tente novamente.';
        validate();
      }
    }

    // Init
    const dateInput = $('date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;
    dateInput.value = today;
    sel.date = today;
    dateInput.onchange = () => { sel.date = dateInput.value; loadSlots(); validate(); };
    $('name').oninput = validate;
    $('submit').onclick = submit;

    loadInfo();
    loadServices();
  </script>
</body>
</html>
