<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" />
  <title>Agendamento Online</title>
  <style>
    :root{
      --bg:#0E1014; --surface:#161922; --surface2:#1C2029; --primary:#F0C24B;
      --gold1:#F6D06B; --gold2:#D99A2B; --text:#F5F7FB; --muted:#98A2B3;
      --border:#242A36; --wa:#25D366; --danger:#FF5C5C; --ok:#3FCB86;
      --ring:rgba(240,194,75,.32);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--text); line-height:1.55; padding:18px; max-width:560px; margin:0 auto;
      background-image:radial-gradient(900px 400px at 50% -90px, rgba(240,194,75,.12), transparent 62%);
      -webkit-font-smoothing:antialiased;
    }
    header{text-align:center;margin:24px 0 8px;}
    .badge{width:80px;height:80px;border-radius:24px;margin:0 auto;background:linear-gradient(135deg,var(--gold1),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 14px 34px rgba(217,154,43,.4);overflow:hidden;}
    .badge img{width:100%;height:100%;object-fit:cover;}
    h1{font-size:24px;margin-top:16px;letter-spacing:-.4px;font-weight:820;}
    .addr{color:var(--muted);font-size:13.5px;margin-top:6px;}
    .secure{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:12.5px;color:#AEB6C4;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:999px;padding:6px 13px;}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(63,203,134,.16);}
    .card{background:linear-gradient(180deg,var(--surface),#12151d);border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 12px 34px rgba(0,0,0,.28);}
    .step{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
    .step .n{width:28px;height:28px;border-radius:9px;background:radial-gradient(120% 120% at 30% 20%, rgba(240,194,75,.2), var(--surface2));border:1px solid var(--border);color:var(--primary);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .step .t{color:var(--text);font-size:15px;font-weight:750;}
    .services{display:grid;gap:10px;}
    .service{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:15px;padding:14px 16px;cursor:pointer;background:var(--surface2);transition:.15s;}
    .service:hover{border-color:rgba(240,194,75,.5);transform:translateY(-1px);}
    .service.active{border-color:var(--primary);background:rgba(240,194,75,.09);box-shadow:0 0 0 4px var(--ring);}
    .service .name{font-weight:750;}
    .service .desc{color:var(--muted);font-size:12.5px;margin-top:3px;}
    .service .price{color:var(--primary);font-weight:850;white-space:nowrap;font-size:16px;}
    input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 15px;color:var(--text);font-size:16px;transition:border-color .12s, box-shadow .12s;}
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--ring);}
    input[type="date"]{color-scheme:dark;}
    .slots{display:flex;flex-wrap:wrap;gap:9px;}
    .slot{border:1.5px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:10px 16px;cursor:pointer;font-size:15px;font-weight:650;transition:.12s;}
    .slot:hover{border-color:rgba(240,194,75,.5);}
    .slot.active{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#191307;border-color:transparent;font-weight:850;box-shadow:0 8px 20px rgba(217,154,43,.32);}
    .hint{color:var(--muted);font-size:13.5px;}
    button.cta{width:100%;border:none;border-radius:16px;padding:17px;font-size:16px;font-weight:850;cursor:pointer;margin-top:18px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#191307;box-shadow:0 14px 32px rgba(217,154,43,.38);transition:transform .12s, filter .12s;}
    button.cta:hover:not(:disabled){filter:brightness(1.05);}
    button.cta:active{transform:translateY(1px);}
    button.cta:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;}
    .ok{text-align:center;padding:30px 24px;}
    .ok .check{font-size:62px;}
    .wa-btn{display:inline-block;margin-top:18px;background:var(--wa);color:#fff;text-decoration:none;padding:15px 24px;border-radius:14px;font-weight:800;box-shadow:0 12px 28px rgba(37,211,102,.32);}
    footer{text-align:center;color:var(--muted);font-size:12px;margin:30px 0 12px;}
    footer .fb{display:inline-flex;align-items:center;gap:6px;}
    .err{color:var(--danger);font-size:14px;margin-top:10px;}
    .fatal{text-align:center;padding:56px 16px;color:var(--muted);}
    .tabs{display:inline-flex;gap:6px;justify-content:center;margin-top:16px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:5px;}
    .tab{padding:9px 20px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:700;transition:.12s;}
    .tab.active{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#191307;}
  </style>
</head>
<body>
  <header>
    <div class="badge">💈</div>
    <h1 id="biz-name">Agendamento Online</h1>
    <div class="addr" id="biz-addr"></div>
    <div class="tabs">
      <a class="tab active" href="#">Agendar</a>
      <a class="tab" id="tab-loja" href="#">Loja</a>
    </div>
    <div><span class="secure"><span class="dot"></span> Agendamento online seguro</span></div>
  </header>

  <div id="fatal" class="fatal" style="display:none"></div>

  <div id="form-view" style="display:none">
    <div class="card">
      <div class="step"><span class="n">1</span><span class="t">Escolha o serviço</span></div>
      <div class="services" id="services"><div class="hint">Carregando…</div></div>
    </div>
    <div class="card" id="prof-card" style="display:none">
      <div class="step"><span class="n">✂️</span><span class="t">Escolha o profissional</span></div>
      <div class="slots" id="profs"></div>
    </div>
    <div class="card">
      <div class="step"><span class="n">2</span><span class="t">Escolha a data</span></div>
      <input type="date" id="date" />
    </div>
    <div class="card">
      <div class="step"><span class="n">3</span><span class="t">Escolha o horário</span></div>
      <div class="slots" id="slots"><div class="hint">Selecione um serviço e uma data.</div></div>
    </div>
    <div class="card">
      <div class="step"><span class="n">4</span><span class="t">Seus dados</span></div>
      <input type="text" id="name" placeholder="Seu nome" style="margin-bottom:10px" />
      <input type="tel" id="phone" placeholder="WhatsApp com DDD (ex: 93 99999-9999)" />
    </div>
    <button class="cta" id="submit" disabled>Confirmar agendamento</button>
    <div class="err" id="err"></div>
  </div>

  <div id="ok-view" class="ok card" style="display:none">
    <div class="check">✅</div>
    <h1>Agendamento enviado!</h1>
    <p id="ok-summary" class="hint" style="margin-top:10px"></p>
    <a id="wa-link" class="wa-btn" href="#" target="_blank">Confirmar no WhatsApp</a>
    <div><button class="cta" style="max-width:230px;margin:20px auto 0" onclick="location.reload()">Novo agendamento</button></div>
  </div>

  <footer><span class="fb">💈 Powered by <b style="color:#C6CDDA">Agenda Barber</b></span></footer>

  <script>
    const slug = (location.pathname.split('/agendar/')[1] || '').replace(/\/$/, '');
    const P = '/public/' + slug;
    let biz = { whatsapp_number: '', nome: '' };
    let services = [];
    const sel = { service: null, date: null, time: null, barber: null };
    const $ = (id) => document.getElementById(id);
    const fmtDateBR = (iso) => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
    $('tab-loja').href = '/loja/' + slug;

    async function init() {
      if (!slug) { showFatal('Link inválido. Peça o link de agendamento à barbearia.'); return; }
      try {
        const r = await fetch(P + '/info');
        if (r.status === 404) return showFatal('Barbearia não encontrada.');
        if (r.status === 403) return showFatal('Agendamento online temporariamente indisponível.');
        if (!r.ok) throw new Error();
        biz = await r.json();
        $('biz-name').textContent = biz.nome;
        $('biz-addr').textContent = biz.endereco || '';
        if (biz.logo_url) { document.querySelector('.badge').innerHTML = `<img src="${biz.logo_url}" alt="" />`; }
        document.title = 'Agendar — ' + biz.nome;
        $('form-view').style.display = 'block';
        loadServices();
        loadBarbers();
      } catch (e) { showFatal('Não foi possível carregar. Tente novamente.'); }
    }

    async function loadBarbers() {
      try {
        const list = await (await fetch(P + '/barbers')).json();
        if (!list || !list.length) return;
        const box = $('profs'); box.innerHTML = '';
        const mk = (id, name) => {
          const b = document.createElement('div'); b.className = 'slot'; b.textContent = name;
          if (id === sel.barber) b.classList.add('active');
          b.onclick = () => { sel.barber = id; document.querySelectorAll('#profs .slot').forEach((e) => e.classList.remove('active')); b.classList.add('active'); loadSlots(); };
          return b;
        };
        box.appendChild(mk(null, 'Qualquer um'));
        list.forEach((b) => box.appendChild(mk(b.id, b.name)));
        $('prof-card').style.display = 'block';
      } catch (e) {}
    }

    function showFatal(msg) { $('fatal').textContent = msg; $('fatal').style.display = 'block'; }

    async function loadServices() {
      try {
        services = await (await fetch(P + '/services')).json();
        const box = $('services'); box.innerHTML = '';
        services.forEach((s) => {
          const el = document.createElement('div');
          el.className = 'service';
          el.innerHTML = `<div><div class="name">${s.name}</div>
            <div class="desc">${s.description || ''} · ${s.duration_minutes} min</div></div>
            <div class="price">R$ ${Number(s.price).toFixed(2)}</div>`;
          el.onclick = () => {
            sel.service = s;
            document.querySelectorAll('.service').forEach((e) => e.classList.remove('active'));
            el.classList.add('active'); loadSlots(); validate();
          };
          box.appendChild(el);
        });
      } catch (e) { $('services').innerHTML = '<div class="err">Erro ao carregar serviços.</div>'; }
    }

    async function loadSlots() {
      const box = $('slots'); sel.time = null;
      if (!sel.service || !sel.date) { box.innerHTML = '<div class="hint">Selecione um serviço e uma data.</div>'; return; }
      box.innerHTML = '<div class="hint">Buscando horários livres…</div>';
      try {
        const data = await (await fetch(`${P}/availability?date=${sel.date}&service_id=${sel.service.id}${sel.barber ? `&barber_id=${sel.barber}` : ''}`)).json();
        if (!data.slots || !data.slots.length) { box.innerHTML = '<div class="hint">Sem horários livres nesta data.</div>'; return; }
        box.innerHTML = '';
        data.slots.forEach((t) => {
          const b = document.createElement('div'); b.className = 'slot'; b.textContent = t;
          b.onclick = () => { sel.time = t; document.querySelectorAll('.slot').forEach((e) => e.classList.remove('active')); b.classList.add('active'); validate(); };
          box.appendChild(b);
        });
      } catch (e) { box.innerHTML = '<div class="err">Erro ao buscar horários.</div>'; }
    }

    function validate() { $('submit').disabled = !(sel.service && sel.date && sel.time && $('name').value.trim()); }

    async function submit() {
      $('err').textContent = ''; $('submit').disabled = true;
      const payload = {
        customer_name: $('name').value.trim(), phone: $('phone').value.trim(),
        service_id: sel.service.id, service_name: sel.service.name,
        barber_id: sel.barber, date: sel.date, time: sel.time + ':00', source: 'web', notes: '',
      };
      try {
        const r = await fetch(P + '/appointments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (r.status === 409) { $('err').textContent = 'Esse horário acabou de ser ocupado. Escolha outro.'; loadSlots(); validate(); return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const msg = `Olá, tudo bem? Fiz um agendamento em ${biz.nome}: ${sel.service.name} para ${fmtDateBR(sel.date)} às ${sel.time}. (Cliente: ${payload.customer_name})`;
        $('ok-summary').textContent = msg;
        if (biz.whatsapp_number) { $('wa-link').href = `https://wa.me/55${biz.whatsapp_number.replace(/^55/, '')}?text=${encodeURIComponent(msg)}`; }
        else { $('wa-link').style.display = 'none'; }
        $('form-view').style.display = 'none'; $('ok-view').style.display = 'block'; window.scrollTo(0, 0);
      } catch (e) { $('err').textContent = 'Não foi possível concluir. Tente novamente.'; validate(); }
    }

    const dateInput = $('date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today; dateInput.value = today; sel.date = today;
    dateInput.onchange = () => { sel.date = dateInput.value; loadSlots(); validate(); };
    $('name').oninput = validate;
    $('submit').onclick = submit;
    init();
  </script>
</body>
</html>
