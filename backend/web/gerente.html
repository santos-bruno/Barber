<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" />
  <title>Painel — Agenda Barber</title>
  <style>
    :root{--bg:#0E1014;--surface:#161922;--surface2:#1C2029;--primary:#F0C24B;--gold1:#F6D06B;--gold2:#D99A2B;--text:#F5F7FB;--muted:#98A2B3;--border:#242A36;--wa:#25D366;--danger:#FF5C5C;--info:#4C8DFF;--ring:rgba(240,194,75,.30);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}
    button{border:none;border-radius:11px;font-weight:750;cursor:pointer;font-size:14px;transition:transform .1s, filter .12s, box-shadow .12s;}
    button:active{transform:translateY(1px);}
    input,select{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px;color:var(--text);font-size:15px;width:100%;transition:border-color .12s, box-shadow .12s;}
    input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--ring);}
    .gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#191307;box-shadow:0 8px 20px rgba(217,154,43,.3);}
    .gold:hover{filter:brightness(1.05);}
    .card{background:linear-gradient(180deg,var(--surface),#12151d);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.22);}
    .muted{color:var(--muted);} .err{color:var(--danger);margin-top:8px;} .ok{color:var(--wa);margin-top:8px;}
    .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;display:block;}

    /* ---------- LOGIN ---------- */
    #login{max-width:410px;margin:70px auto;box-shadow:0 30px 80px rgba(0,0,0,.5);
      background-image:radial-gradient(600px 300px at 80% -80px, rgba(240,194,75,.10), transparent 60%);}
    .brand-c{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:20px;}
    .mark{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--gold1),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 10px 24px rgba(217,154,43,.4);}
    .btn-full{width:100%;padding:15px;margin-top:18px;font-size:15px;border-radius:13px;}

    /* ---------- LAYOUT (sidebar + content) ---------- */
    .topbar{display:none;position:sticky;top:0;z-index:15;background:rgba(14,16,20,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:11px 14px;align-items:center;gap:12px;}
    .burger{background:var(--surface2);color:var(--text);border:1px solid var(--border);width:42px;height:42px;border-radius:11px;font-size:17px;flex-shrink:0;}
    .tb-shop{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:262px;display:flex;flex-direction:column;background:linear-gradient(180deg,#13161e,#0C0E12);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;z-index:30;}
    .sidebar::-webkit-scrollbar{width:0;}
    .content{margin-left:262px;min-height:100vh;}
    .inner{max-width:940px;margin:0 auto;padding:28px 24px 70px;}
    .brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid var(--border);margin-bottom:8px;}
    .brand-logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--gold1),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0;box-shadow:0 8px 20px rgba(217,154,43,.35);}
    .brand-logo img{width:100%;height:100%;object-fit:cover;}
    .brand-txt{display:flex;flex-direction:column;min-width:0;}
    .brand-txt strong{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;}
    .brand-txt .muted{font-size:11px;}
    nav{flex:1;padding-top:6px;}
    .nav-group{margin:16px 0 4px;padding:0 12px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#67707F;}
    .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);cursor:pointer;font-weight:650;font-size:14.5px;transition:.12s;margin-top:2px;}
    .nav-item:hover{background:var(--surface);color:var(--text);}
    .nav-item.active{background:linear-gradient(135deg,rgba(246,208,107,.16),rgba(217,154,43,.09));color:var(--primary);box-shadow:inset 0 0 0 1px rgba(240,194,75,.22);}
    .nav-item .ic{width:22px;text-align:center;font-size:16px;}
    .profile{display:flex;align-items:center;gap:11px;padding:12px 8px 2px;border-top:1px solid var(--border);margin-top:10px;}
    .avatar{width:40px;height:40px;border-radius:11px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);overflow:hidden;flex-shrink:0;font-size:14px;}
    .avatar img{width:100%;height:100%;object-fit:cover;}
    .p-info{display:flex;flex-direction:column;min-width:0;flex:1;}
    .p-info strong{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .p-info .muted{font-size:11px;}
    .p-logout{background:var(--surface2);color:var(--muted);border:1px solid var(--border);width:34px;height:34px;border-radius:10px;font-size:15px;flex-shrink:0;}
    .p-logout:hover{color:var(--danger);border-color:rgba(255,92,92,.5);}
    .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25;}
    .backdrop.show{display:block;}
    @media(max-width:860px){
      .topbar{display:flex;}
      .sidebar{transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 50px rgba(0,0,0,.6);}
      .sidebar.open{transform:none;}
      .content{margin-left:0;}
      .inner{padding:18px 16px 60px;}
    }

    /* ---------- COMPONENTES ---------- */
    h2{font-size:22px;margin-bottom:4px;letter-spacing:-.4px;font-weight:800;}
    .subtitle{color:var(--muted);font-size:14px;margin-bottom:18px;}
    .row{display:flex;gap:12px;flex-wrap:wrap;}
    .stat{flex:1;min-width:140px;background:linear-gradient(180deg,var(--surface),#12151d);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2);}
    .stat .n{font-size:26px;font-weight:850;letter-spacing:-.5px;background:linear-gradient(115deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;} .stat .l{color:var(--muted);font-size:12px;margin-top:3px;}
    .item{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:15px;margin-top:11px;transition:transform .12s, border-color .12s;}
    .item:hover{transform:translateY(-1px);border-color:rgba(240,194,75,.28);}
    .item.lft{border-left:4px solid var(--border);}
    .between{display:flex;justify-content:space-between;align-items:center;gap:8px;}
    .badge{border-radius:999px;padding:4px 11px;font-size:11px;font-weight:800;text-transform:uppercase;color:#191307;white-space:nowrap;letter-spacing:.03em;}
    .b-pendente{background:var(--primary);} .b-confirmado{background:var(--info);color:#fff;} .b-concluido{background:var(--wa);} .b-cancelado{background:var(--danger);color:#fff;}
    .chip{display:inline-block;padding:8px 12px;border-radius:10px;color:#fff;font-size:13px;margin:6px 6px 0 0;font-weight:750;transition:filter .12s;}
    .chip:hover{filter:brightness(1.08);}
    .c-blue{background:var(--info);} .c-green{background:var(--wa);} .c-wa{background:#128C7E;} .c-red{background:var(--danger);}
    .selrow{display:flex;flex-wrap:wrap;gap:8px;}
    .pill{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:9px 14px;border-radius:999px;cursor:pointer;transition:.12s;}
    .pill:hover{border-color:rgba(240,194,75,.4);}
    .pill.on{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#191307;border-color:transparent;font-weight:800;}
    .primary{padding:14px 18px;border-radius:12px;} .danger{background:var(--danger);color:#fff;} .small{padding:9px 13px;font-size:13px;border-radius:10px;}
    table{width:100%;border-collapse:collapse;} td{padding:9px 0;border-bottom:1px solid var(--border);}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
    .pz-logo{width:96px;height:96px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;flex-shrink:0;}
    .pz-logo img{width:100%;height:100%;object-fit:cover;}
    .hidden{display:none;}
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login" class="card">
    <div class="brand-c"><span class="mark">💈</span><strong style="font-size:20px">Agenda Barber</strong></div>
    <div class="muted" style="text-align:center;margin-bottom:8px">Painel de gestão</div>
    <label class="label">E-mail</label><input id="l-email" type="email" />
    <label class="label">Senha</label><input id="l-pass" type="password" />
    <button class="gold btn-full" onclick="doLogin()">Entrar</button>
    <div class="err" id="l-err"></div>
    <div class="muted" style="font-size:13px;margin-top:14px;text-align:center">Não tem conta? <a href="/" style="color:var(--primary)">Criar grátis</a></div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="topbar">
      <button class="burger" onclick="toggleNav()">☰</button>
      <span class="tb-shop" id="tb-shop">—</span>
    </div>
    <div class="backdrop" id="backdrop" onclick="toggleNav(false)"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" id="brandLogo">💈</div>
        <div class="brand-txt"><strong id="shop">—</strong><span class="muted" id="shopSub">Painel de gestão</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="profile">
        <div class="avatar" id="avatar">B</div>
        <div class="p-info"><strong id="who">—</strong><span class="muted" id="role"></span></div>
        <button class="p-logout" onclick="logout()" title="Sair">⎋</button>
      </div>
    </aside>

    <main class="content"><div class="inner"><div id="view"></div></div></main>
  </div>

  <script>
    const TK = '@agendabarber/gtoken';
    const $ = (id) => document.getElementById(id);
    const money = (v) => 'R$ ' + Number(v||0).toFixed(2).replace('.', ',');
    const hhmm = (t) => (t||'').slice(0,5);
    const brDate = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
    const todayISO = () => new Date().toISOString().split('T')[0];
    let ME = null;

    async function api(path, opts={}) {
      const t = localStorage.getItem(TK) || '';
      const r = await fetch(path, { headers:{'Content-Type':'application/json','Authorization':'Bearer '+t}, ...opts });
      if (r.status === 401) { logout(); throw new Error('Sessão expirada'); }
      if (!r.ok) { let d='Erro '+r.status; try{const b=await r.json(); if(b.detail)d=b.detail;}catch(e){} throw new Error(d); }
      if (r.status === 204) return null;
      return r.json();
    }

    async function doLogin() {
      $('l-err').textContent='';
      try {
        const d = await (await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('l-email').value.trim(),password:$('l-pass').value})})).json();
        if (!d.token) { $('l-err').textContent = d.detail || 'E-mail ou senha inválidos.'; return; }
        localStorage.setItem(TK, d.token);
        start();
      } catch(e){ $('l-err').textContent='Erro de conexão.'; }
    }
    function logout(){ localStorage.removeItem(TK); $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

    const isOwner = () => (ME?.user?.role||'owner')==='owner';

    // Navegação agrupada (estilo dashboard).
    const NAV = [
      { group:'Principal', items:[
        { id:'agenda',       label:'Agenda',            icon:'📅', owner:false },
        { id:'novo',         label:'Novo agendamento',  icon:'➕', owner:false },
        { id:'clientes',     label:'Clientes',          icon:'👥', owner:false },
      ]},
      { group:'Gestão', items:[
        { id:'caixa',        label:'Fluxo de caixa',    icon:'💰', owner:true },
        { id:'barbeiros',    label:'Barbeiros',         icon:'✂️', owner:true },
        { id:'horarios',     label:'Horários',          icon:'🕐', owner:true },
        { id:'planos',       label:'Planos de corte',   icon:'🎟️', owner:true },
        { id:'loja',         label:'Loja / Estoque',    icon:'📦', owner:true },
        { id:'pedidos',      label:'Pedidos',           icon:'🛒', owner:true },
      ]},
      { group:'Conta', items:[
        { id:'assinatura',   label:'Assinatura',        icon:'💳', owner:true },
        { id:'personalizar', label:'Personalização',    icon:'🎨', owner:true },
        { id:'conta',        label:'Minha conta',       icon:'⚙️', owner:false },
      ]},
    ];
    const NAV_FLAT = NAV.flatMap(g => g.items);
    let current = 'agenda';

    function renderNav(){
      const owner = isOwner();
      $('nav').innerHTML = NAV.map(g=>{
        const items = g.items.filter(it => owner || !it.owner);
        if(!items.length) return '';
        return `<div class="nav-group">${g.group}</div>` +
          items.map(it=>`<div class="nav-item" data-id="${it.id}" onclick="go('${it.id}')"><span class="ic">${it.icon}</span>${it.label}</div>`).join('');
      }).join('');
    }

    function initials(n){ return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
    function refreshBrand(){
      const logo = ME.tenant.logo_url;
      $('brandLogo').innerHTML = logo ? `<img src="${logo}" alt=""/>` : '💈';
      $('shop').textContent = ME.tenant.name;
      $('tb-shop').textContent = ME.tenant.name;
      $('who').textContent = ME.user.name;
      $('role').textContent = isOwner() ? 'Dono da barbearia' : 'Barbeiro';
      $('avatar').innerHTML = logo ? `<img src="${logo}" alt=""/>` : initials(ME.user.name);
    }

    function toggleNav(force){
      const sb=$('sidebar'), bd=$('backdrop');
      const open = force===undefined ? !sb.classList.contains('open') : force;
      sb.classList.toggle('open', open); bd.classList.toggle('show', open);
    }

    async function start() {
      try { ME = await api('/auth/me'); } catch(e){ return; }
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      renderNav(); refreshBrand();
      // Se o barbeiro cair numa aba de dono, volta para a agenda.
      const cur = NAV_FLAT.find(it=>it.id===current);
      if(!cur || (cur.owner && !isOwner())) current='agenda';
      go(current);
    }
    function go(id){
      current=id;
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
      render();
      if(window.innerWidth<=860) toggleNav(false);
      const c=document.querySelector('.content'); if(c) c.scrollTo(0,0);
      window.scrollTo(0,0);
    }

    function render(){ ({agenda:vAgenda,novo:vNovo,clientes:vClientes,caixa:vCaixa,barbeiros:vBarbeiros,horarios:vHorarios,planos:vPlanos,loja:vLoja,pedidos:vPedidos,assinatura:vAssinatura,personalizar:vPersonalizar,conta:vConta})[current](); }

    // Cabeçalho padrão de cada página.
    function head(title, subtitle){ return `<h2>${title}</h2>${subtitle?`<div class="subtitle">${subtitle}</div>`:'<div style="height:14px"></div>'}`; }

    // ---------- AGENDA ----------
    async function vAgenda(){
      const v=$('view');
      v.innerHTML = head('Agenda','Acompanhe e atualize os atendimentos do dia.') +
        `<div class="card"><label class="label">Data</label><input type="date" id="ag-date" value="${todayISO()}" /></div>
        <div id="ag-list"></div>`;
      $('ag-date').onchange = loadAgenda; loadAgenda();
    }
    async function loadAgenda(){
      const d = $('ag-date').value;
      try {
        const list = await api('/appointments?date='+d);
        const box=$('ag-list');
        if(!list.length){ box.innerHTML='<p class="muted" style="margin-top:14px">Nenhum agendamento nesta data.</p>'; return; }
        box.innerHTML = list.map(a=>`
          <div class="item lft" style="border-left-color:${({pendente:'#F0C24B',confirmado:'#4C8DFF',concluido:'#25D366',cancelado:'#FF5C5C'})[a.status]||'#262B36'}">
            <div class="between"><strong style="color:var(--primary);font-size:17px">${hhmm(a.time)}</strong><span class="badge b-${a.status}">${a.status}</span></div>
            <div style="margin-top:6px;font-weight:700">${a.customer_name}</div>
            <div class="muted">${a.service_name} · ${money(a.price)}${a.barber_name?' · ✂️ '+a.barber_name:''}${a.payment_type==='assinatura'?' · assinatura':''}</div>
            <div>
              ${a.status!=='concluido'?`<button class="chip c-green" onclick="setStatus(${a.id},'concluido')">Concluir</button>`:''}
              ${a.status!=='confirmado'&&a.status!=='concluido'?`<button class="chip c-blue" onclick="setStatus(${a.id},'confirmado')">Confirmar</button>`:''}
              ${a.phone?`<button class="chip c-wa" onclick="wa('${a.phone}','${a.customer_name.replace(/'/g,'')}')">WhatsApp</button>`:''}
              ${a.status!=='cancelado'?`<button class="chip c-red" onclick="setStatus(${a.id},'cancelado')">Cancelar</button>`:''}
            </div>
          </div>`).join('');
      } catch(e){ $('ag-list').innerHTML='<p class="err">'+e.message+'</p>'; }
    }
    async function setStatus(id,status){ try{ await api('/appointments/'+id,{method:'PATCH',body:JSON.stringify({status})}); loadAgenda(); }catch(e){ alert(e.message);} }
    function wa(phone,name){ const d=phone.replace(/\D/g,''); location.href=`https://wa.me/${d}?text=${encodeURIComponent('Olá '+name+'!')}`; }

    // ---------- NOVO ----------
    let nv = { services:[], barbers:[], service:null, barber:null, date:todayISO(), time:null, pay:'avista' };
    async function vNovo(){
      $('view').innerHTML = head('Novo agendamento','Marque um horário manualmente para um cliente.') + `<div class="card" id="nv"></div>`;
      nv.time=null;
      nv.services = await api('/services'); nv.service = nv.services[0]||null;
      nv.barbers = isOwner() ? await api('/staff').catch(()=>[]) : [];
      drawNovo(); loadNvSlots();
    }
    function drawNovo(){
      const c=$('nv');
      c.innerHTML = `
        ${isOwner()&&nv.barbers.length?`<label class="label">Barbeiro</label><div class="selrow" id="nv-barbers"></div>`:''}
        <label class="label">Serviço</label><div class="selrow" id="nv-services"></div>
        <div class="grid2"><div><label class="label">Data</label><input type="date" id="nv-date" value="${nv.date}"/></div>
        <div><label class="label">Pagamento</label><select id="nv-pay"><option value="avista">À vista</option><option value="assinatura">Assinatura</option></select></div></div>
        <label class="label">Horário</label><div class="selrow" id="nv-slots"><span class="muted">Escolha serviço e data.</span></div>
        <label class="label">Nome do cliente</label><input id="nv-name"/>
        <label class="label">WhatsApp</label><input id="nv-phone" placeholder="93 99999-9999"/>
        <button class="gold primary" style="width:100%;margin-top:16px" onclick="saveNovo()">Criar agendamento</button>
        <div class="err" id="nv-err"></div>`;
      if(isOwner()&&nv.barbers.length){
        const bb=$('nv-barbers'); const mk=(id,name)=>{const e=document.createElement('div');e.className='pill'+(nv.barber===id?' on':'');e.textContent=name;e.onclick=()=>{nv.barber=id;drawNovo();loadNvSlots();};return e;};
        bb.appendChild(mk(null,'Sem definir')); nv.barbers.forEach(b=>bb.appendChild(mk(b.id,b.name)));
      }
      const ss=$('nv-services'); nv.services.forEach(s=>{const e=document.createElement('div');e.className='pill'+(nv.service?.id===s.id?' on':'');e.textContent=s.name;e.onclick=()=>{nv.service=s;drawNovo();loadNvSlots();};ss.appendChild(e);});
      $('nv-date').onchange=(ev)=>{nv.date=ev.target.value;loadNvSlots();};
      $('nv-pay').onchange=(ev)=>{nv.pay=ev.target.value;};
    }
    async function loadNvSlots(){
      if(!nv.service) return; const box=$('nv-slots'); box.innerHTML='<span class="muted">Buscando…</span>'; nv.time=null;
      try{
        const d=await api(`/appointments/availability?date=${nv.date}&service_id=${nv.service.id}${nv.barber?`&barber_id=${nv.barber}`:''}`);
        if(!d.slots.length){box.innerHTML='<span class="muted">Sem horários livres.</span>';return;}
        box.innerHTML=''; d.slots.forEach(t=>{const e=document.createElement('div');e.className='pill';e.textContent=t;e.onclick=()=>{nv.time=t;document.querySelectorAll('#nv-slots .pill').forEach(x=>x.classList.remove('on'));e.classList.add('on');};box.appendChild(e);});
      }catch(e){box.innerHTML='<span class="err">'+e.message+'</span>';}
    }
    async function saveNovo(){
      $('nv-err').textContent='';
      if(!nv.service||!nv.time||!$('nv-name').value.trim()){$('nv-err').textContent='Preencha serviço, horário e nome.';return;}
      try{
        await api('/appointments',{method:'POST',body:JSON.stringify({customer_name:$('nv-name').value.trim(),phone:$('nv-phone').value.trim(),service_id:nv.service.id,service_name:nv.service.name,date:nv.date,time:nv.time+':00',source:'admin',payment_type:nv.pay,barber_id:isOwner()?nv.barber:undefined})});
        alert('Agendamento criado!'); go('agenda');
      }catch(e){$('nv-err').textContent=e.message;}
    }

    // ---------- CLIENTES ----------
    async function vClientes(){
      $('view').innerHTML=head('Clientes','Sua base de clientes e contato rápido no WhatsApp.') +

    function onLogoPick(ev){
      const f=ev.target.files[0]; if(!f) return;
      if(f.size > 12*1024*1024){ alert('Imagem muito grande (máx. 12 MB).'); return; }
      const rd=new FileReader();
      rd.onload=()=>{ const img=new Image();
        img.onload=()=>{
          const max=320; let w=img.width, h=img.height;
          const sc=Math.min(max/w, max/h, 1); w=Math.round(w*sc); h=Math.round(h*sc);
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          _pendingLogo=cv.toDataURL('image/png');
          $('pz-preview').innerHTML=`<img src="${_pendingLogo}" alt=""/>`;
        };
        img.onerror=()=>alert('Não consegui ler essa imagem.');
        img.src=rd.result;
      };
      rd.readAsDataURL(f);
    }

    async function doChangePass(){
      const m=$('cp-msg'); m.textContent=''; m.className='err';
      try{ await api('/auth/change-password',{method:'POST',body:JSON.stringify({current_password:$('cp-cur').value,new_password:$('cp-new').value})}); m.className='ok'; m.textContent='✓ Senha alterada.'; $('cp-cur').value='';$('cp-new').value=''; }catch(e){ m.textContent=e.message; }
    }
    async function resetBarber(id,name){
      if(!confirm('Gerar nova senha para '+name+'?'))return;
      try{ const r=await api('/staff/'+id+'/reset-password',{method:'POST',body:JSON.stringify({})}); alert('Nova senha de '+name+':\n\nLogin: '+r.email+'\nSenha: '+r.password+'\n\nPasse para o barbeiro.'); }catch(e){alert(e.message);}
    }

    // init
    if (localStorage.getItem(TK)) start(); else $('login').classList.remove('hidden');
  </script>
</body>
</html>
