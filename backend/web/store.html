<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" />
  <title>Loja</title>
  <style>
    :root{--bg:#0E1014;--surface:#161922;--surface2:#1C2029;--primary:#F0C24B;--gold1:#F6D06B;--gold2:#D99A2B;--text:#F5F7FB;--muted:#98A2B3;--border:#242A36;--wa:#25D366;--danger:#FF5C5C;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;padding:18px;max-width:560px;margin:0 auto;background-image:radial-gradient(900px 380px at 50% -80px, rgba(240,194,75,.13), transparent 60%);}
    header{text-align:center;margin:22px 0 8px;}
    .badge{width:74px;height:74px;border-radius:20px;margin:0 auto;background:linear-gradient(135deg,var(--gold1),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 12px 30px rgba(217,154,43,.35);}
    h1{font-size:22px;margin-top:12px;}
    .addr{color:var(--muted);font-size:13px;margin-top:4px;}
    .tabs{display:flex;gap:8px;justify-content:center;margin-top:14px;}
    .tab{padding:8px 16px;border-radius:999px;border:1px solid var(--border);color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;}
    .tab.active{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#141414;border-color:transparent;}
    .card{background:linear-gradient(180deg,var(--surface),#141821);border:1px solid var(--border);border-radius:18px;padding:14px;margin-top:14px;display:flex;align-items:center;gap:12px;}
    .card .info{flex:1;}
    .card .name{font-weight:700;}
    .card .desc{color:var(--muted);font-size:13px;margin-top:2px;}
    .card .price{color:var(--primary);font-weight:800;font-size:17px;}
    .qty{display:flex;align-items:center;gap:10px;}
    .qbtn{width:32px;height:32px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;}
    .qn{min-width:20px;text-align:center;font-weight:700;}
    .bar{position:sticky;bottom:0;background:var(--bg);padding:14px 0;margin-top:16px;}
    button.cta{width:100%;border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#141414;box-shadow:0 12px 30px rgba(217,154,43,.35);}
    button.cta:disabled{opacity:.45;box-shadow:none;}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:20;}
    .modal.open{display:flex;}
    .sheet{background:var(--surface);border-top-left-radius:22px;border-top-right-radius:22px;padding:22px;width:100%;max-width:560px;}
    input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px;color:var(--text);font-size:16px;margin-top:10px;}
    .hint{color:var(--muted);font-size:13px;}
    .fatal{text-align:center;padding:50px 16px;color:var(--muted);}
    .ok{text-align:center;padding:30px 16px;}
    .ok .c{font-size:56px;}
    footer{text-align:center;color:var(--muted);font-size:12px;margin:26px 0 10px;}
    .err{color:var(--danger);font-size:14px;margin-top:8px;}
  </style>
</head>
<body>
  <header>
    <div class="badge">🛍️</div>
    <h1 id="biz-name">Loja</h1>
    <div class="addr" id="biz-addr"></div>
    <div class="tabs">
      <a class="tab" id="tab-agendar" href="#">Agendar</a>
      <a class="tab active" href="#">Loja</a>
    </div>
  </header>

  <div id="fatal" class="fatal" style="display:none"></div>
  <div id="list"></div>
  <div id="ok" class="ok card" style="display:none;flex-direction:column">
    <div class="c">✅</div><h1>Pedido enviado!</h1>
    <p class="hint" id="ok-msg" style="margin-top:8px"></p>
    <button class="cta" style="margin-top:16px" onclick="location.reload()">Novo pedido</button>
  </div>

  <div class="bar" id="bar" style="display:none">
    <button class="cta" id="checkout">Finalizar pedido</button>
  </div>

  <footer>Powered by Agenda Barber</footer>

  <div class="modal" id="modal">
    <div class="sheet">
      <h1 style="font-size:20px">Finalizar pedido</h1>
      <p class="hint" id="cart-summary" style="margin-top:6px"></p>
      <input id="c-name" placeholder="Seu nome" />
      <input id="c-phone" placeholder="WhatsApp com DDD" />
      <div class="err" id="c-err"></div>
      <button class="cta" style="margin-top:14px" id="confirm">Confirmar pedido</button>
      <button class="cta" style="margin-top:10px;background:var(--surface2);color:var(--text);box-shadow:none" onclick="document.getElementById('modal').classList.remove('open')">Voltar</button>
    </div>
  </div>

  <script>
    const slug = (location.pathname.split('/loja/')[1] || '').replace(/\/$/, '');
    const P = '/public/' + slug;
    const $ = (id) => document.getElementById(id);
    let biz = {}; let products = []; const cart = {};

    $('tab-agendar').href = '/agendar/' + slug;

    async function init() {
      if (!slug) return fatal('Link inválido.');
      try {
        const r = await fetch(P + '/info');
        if (r.status === 404) return fatal('Barbearia não encontrada.');
        if (r.status === 403) return fatal('Loja temporariamente indisponível.');
        biz = await r.json();
        $('biz-name').textContent = biz.nome;
        $('biz-addr').textContent = biz.endereco || '';
        document.title = 'Loja — ' + biz.nome;
        loadProducts();
      } catch (e) { fatal('Não foi possível carregar.'); }
    }
    function fatal(m){ $('fatal').textContent = m; $('fatal').style.display='block'; }

    async function loadProducts() {
      products = await (await fetch(P + '/products')).json();
      const box = $('list');
      if (!products.length) { box.innerHTML = '<p class="hint" style="text-align:center;margin-top:30px">Nenhum produto disponível no momento.</p>'; return; }
      box.innerHTML = '';
      products.forEach((p) => {
        cart[p.id] = 0;
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `<div class="info"><div class="name">${p.name}</div>
          <div class="desc">${p.description || ''}${p.stock <= 0 ? ' · esgotado' : ''}</div>
          <div class="price">R$ ${Number(p.price).toFixed(2)}</div></div>
          <div class="qty">
            <button class="qbtn" onclick="chg(${p.id},-1)">−</button>
            <span class="qn" id="q-${p.id}">0</span>
            <button class="qbtn" onclick="chg(${p.id},1)">+</button>
          </div>`;
        box.appendChild(el);
      });
    }

    window.chg = (id, d) => {
      const p = products.find((x) => x.id === id);
      let q = cart[id] + d;
      if (q < 0) q = 0;
      if (q > p.stock) q = p.stock;
      cart[id] = q; $('q-' + id).textContent = q;
      const total = Object.entries(cart).reduce((s, [pid, qt]) => s + qt * products.find((x) => x.id == pid).price, 0);
      const count = Object.values(cart).reduce((a, b) => a + b, 0);
      $('bar').style.display = count > 0 ? 'block' : 'none';
      $('checkout').textContent = `Finalizar pedido · R$ ${total.toFixed(2)}`;
    };

    $('checkout').onclick = () => {
      const count = Object.values(cart).reduce((a, b) => a + b, 0);
      if (!count) return;
      const total = Object.entries(cart).reduce((s, [pid, qt]) => s + qt * products.find((x) => x.id == pid).price, 0);
      $('cart-summary').textContent = `${count} item(ns) · Total R$ ${total.toFixed(2)}`;
      $('modal').classList.add('open');
    };

    $('confirm').onclick = async () => {
      $('c-err').textContent = '';
      const items = Object.entries(cart).filter(([, q]) => q > 0).map(([pid, q]) => ({ product_id: Number(pid), qty: q }));
      const name = $('c-name').value.trim();
      if (!name) { $('c-err').textContent = 'Informe seu nome.'; return; }
      try {
        const r = await fetch(P + '/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ customer_name: name, phone: $('c-phone').value.trim(), items }) });
        const data = await r.json();
        if (!r.ok) { $('c-err').textContent = data.detail || 'Erro ao enviar pedido.'; return; }
        $('modal').classList.remove('open'); $('list').style.display = 'none'; $('bar').style.display = 'none';
        $('ok-msg').textContent = `Total R$ ${Number(data.total).toFixed(2)}. A barbearia vai entrar em contato.`;
        $('ok').style.display = 'flex';
      } catch (e) { $('c-err').textContent = 'Erro de conexão.'; }
    };

    init();
  </script>
</body>
</html>
