<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" />
  <title>Assinar — Agenda Barber</title>
  <!--
    ⚠️ APPMAX JS: confirme a URL exata do script na doc "1.3 Appmax JS" e cole abaixo.
    Sem ela, a tokenização do cartão não carrega. Pode vir também um atributo com o
    external_id gerado na instalação do app (retornado pelo /billing/appmax/validate).
  -->
  <!-- <script src="COLE_AQUI_A_URL_DO_APPMAX_JS" data-appmax-external-id="SEU_EXTERNAL_ID"></script> -->
  <style>
    :root{--bg:#0F1115;--surface:#171A21;--surface2:#1E222B;--primary:#F0C24B;--gold1:#F6D06B;--gold2:#D99A2B;--text:#F4F6FB;--muted:#9AA3B2;--border:#262B36;--wa:#25D366;--danger:#FF5C5C;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:18px;max-width:520px;margin:0 auto;line-height:1.5;}
    header{display:flex;align-items:center;gap:12px;padding:12px 0 18px;}
    .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold1),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:22px;}
    h1{font-size:19px;font-weight:800;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
    label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;margin:12px 0 6px;}
    input,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px;color:var(--text);font-size:16px;}
    .row{display:flex;gap:10px;}
    .btn{border:none;border-radius:12px;font-weight:800;cursor:pointer;padding:14px;font-size:15px;width:100%;margin-top:16px;}
    .btn-primary{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#141414;}
    .btn-ghost{background:transparent;color:var(--primary);border:1.5px solid rgba(240,194,75,.5);}
    .muted{color:var(--muted);font-size:13px;}
    .msg{margin-top:12px;font-size:14px;}
    .err{color:var(--danger);} .ok{color:var(--wa);}
    .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0;}
    .sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--border);}
  </style>
</head>
<body>
  <header>
    <div class="mark">💈</div>
    <div><h1>Assinar o Agenda Barber</h1><div class="muted">Pagamento seguro via Appmax</div></div>
  </header>

  <div id="need-login" class="card" style="display:none">
    <strong>Você precisa entrar primeiro</strong>
    <p class="muted" style="margin-top:6px">Faça login no painel para assinar.</p>
    <a class="btn btn-primary" href="/gerente" style="display:block;text-align:center;text-decoration:none">Ir para o login</a>
  </div>

  <div id="checkout" style="display:none">
    <div class="card">
      <label>Plano</label>
      <select id="plan"></select>
      <label>CPF ou CNPJ (do titular)</label>
      <input id="doc" placeholder="Somente números" inputmode="numeric" />
    </div>

    <!-- Cartão via Appmax JS (tokeniza no navegador; o cartão não passa pelo servidor) -->
    <form id="payment-form" class="card" data-appmax-checkout>
      <strong>Cartão de crédito</strong>
      <label>Número do cartão</label>
      <input id="card-number" appmax-form-element="number" inputmode="numeric" placeholder="0000 0000 0000 0000" required />
      <label>Nome do titular (como no cartão)</label>
      <input id="holder" appmax-form-element="holder_name" placeholder="NOME COMPLETO" required />
      <div class="row">
        <div style="flex:1"><label>Mês</label><input appmax-form-element="expiration_month" placeholder="MM" inputmode="numeric" required /></div>
        <div style="flex:1"><label>Ano</label><input appmax-form-element="expiration_year" placeholder="AA" inputmode="numeric" required /></div>
        <div style="flex:1"><label>CVV</label><input appmax-form-element="cvv" placeholder="123" inputmode="numeric" required /></div>
      </div>
      <button type="submit" class="btn btn-primary" id="pay-btn">Assinar no cartão</button>
      <div class="msg" id="pay-msg"></div>
      <p class="muted" style="margin-top:10px">Cobrança recorrente (renova automaticamente). Cancele quando quiser.</p>
    </form>

    <div class="sep">ou</div>
    <div class="card">
      <strong>Prefere pix / boleto / link?</strong>
      <p class="muted" style="margin-top:4px">Abrimos o checkout hospedado da Appmax.</p>
      <button class="btn btn-ghost" id="link-btn">Gerar link de pagamento</button>
      <div class="msg" id="link-msg"></div>
    </div>
  </div>

  <script>
    const TK = '@agendabarber/gtoken';
    const $ = (id) => document.getElementById(id);
    const token = localStorage.getItem(TK) || '';
    let PLANS = [];

    async function api(path, opts={}) {
      const r = await fetch(path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers||{}) },
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || ('Erro ' + r.status));
      return data;
    }

    async function init() {
      if (!token) { $('need-login').style.display = 'block'; return; }
      $('checkout').style.display = 'block';
      try {
        const d = await (await fetch('/billing/plans')).json();
        PLANS = d.plans || [];
        $('plan').innerHTML = PLANS.map((p) => `<option value="${p.id}">${p.label} — R$ ${Number(p.price).toFixed(2)}</option>`).join('');
      } catch (e) {}
    }

    // Link de pagamento hospedado (funciona já; a barbearia é liberada pelo webhook)
    $('link-btn').onclick = async () => {
      const msg = $('link-msg'); msg.textContent = 'Gerando…'; msg.className = 'msg';
      try {
        const r = await api('/billing/appmax/subscribe', { method: 'POST', body: JSON.stringify({ plan: $('plan').value, cpf_cnpj: $('doc').value.replace(/\D/g, '') }) });
        if (r.checkout_url) { window.location.href = r.checkout_url; }
        else { msg.className = 'msg err'; msg.textContent = 'Não recebi o link de pagamento.'; }
      } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    };

    // Cartão recorrente: o Appmax JS tokeniza no submit e devolve o token.
    // O nome do campo pode variar conforme a versão do Appmax JS — ajustamos no teste sandbox.
    $('payment-form').addEventListener('appmax:tokenized', (ev) => sendCard(ev.detail && (ev.detail.token || ev.detail)));
    $('payment-form').addEventListener('submit', (ev) => {
      // Se o Appmax JS já injetou um token no form, usamos; senão deixamos o Appmax JS agir.
      const hidden = $('payment-form').querySelector('input[name="token"], [appmax-token]');
      if (hidden && hidden.value) { ev.preventDefault(); sendCard(hidden.value); }
    });

    async function sendCard(cardToken) {
      const msg = $('pay-msg');
      if (!cardToken) { msg.className = 'msg err'; msg.textContent = 'Não recebi o token do cartão (verifique o Appmax JS).'; return; }
      msg.textContent = 'Processando pagamento…'; msg.className = 'msg';
      try {
        await api('/billing/appmax/checkout', { method: 'POST', body: JSON.stringify({
          plan: $('plan').value,
          card_token: cardToken,
          holder_name: $('holder').value,
          cpf_cnpj: $('doc').value.replace(/\D/g, ''),
        }) });
        msg.className = 'msg ok'; msg.textContent = '✓ Assinatura criada! A liberação é confirmada em instantes.';
        setTimeout(() => { window.location.href = '/gerente'; }, 2500);
      } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    }

    init();
  </script>
</body>
</html>
