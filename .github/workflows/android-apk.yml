name: Build Android APK

# Compila o APK automaticamente a cada push na branch main.
# Também permite disparo manual pela aba Actions.
on:
  push:
    branches:
      - main
      - claude/barbearia-perison-app-setup-kzvgv5
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Expo prebuild + Gradle)
    runs-on: ubuntu-latest

    # Necessário para publicar o APK em uma Release.
    permissions:
      contents: write

    # URL do backend embutida no app (aponta pro servidor no Render).
    env:
      EXPO_PUBLIC_API_URL: https://agenda-barber-o0to.onrender.com

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js + cache de dependências
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      # 3. Gera a pasta nativa android/ a partir do projeto Expo
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      # 4. Ambiente Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. Compila o APK de release nativamente
      - name: Build APK (assembleRelease)
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # 6. Renomeia o APK para um nome amigável
      - name: Renomear APK
        working-directory: frontend/android/app/build/outputs/apk/release
        run: |
          SRC=$(ls *.apk | head -n1)
          cp "$SRC" "agenda-barber.apk"
          ls -la

      # 7. Publica o APK como Artifact do GitHub (download via aba Actions)
      - name: Upload do APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: agenda-barber-apk
          path: frontend/android/app/build/outputs/apk/release/agenda-barber.apk
          if-no-files-found: error
          retention-days: 30

      # 8. Publica o APK em uma Release (link de download direto, sem login)
      - name: Publicar APK em Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Agenda Barber - APK (build mais recente)
          body: |
            APK gerado automaticamente pela pipeline (Expo prebuild + Gradle).
            Assinado com a chave de debug — instalável diretamente no Android
            (ative "Instalar apps de fontes desconhecidas").
          files: frontend/android/app/build/outputs/apk/release/agenda-barber.apk
          fail_on_unmatched_files: true
