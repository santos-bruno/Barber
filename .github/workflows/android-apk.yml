name: Build Android APK

# Compila o APK automaticamente a cada push na branch main.
# Também permite disparo manual pela aba Actions.
on:
  push:
    branches:
      - main
      - claude/barbearia-perison-app-setup-kzvgv5
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Expo prebuild + Gradle)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js + cache de dependências
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      # 3. Gera a pasta nativa android/ a partir do projeto Expo
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      # 4. Ambiente Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. Compila o APK de release nativamente
      - name: Build APK (assembleRelease)
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # 6. Publica o APK como Artifact do GitHub para download
      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: barbearia-sr-perison-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
