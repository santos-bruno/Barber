# Blueprint de deploy no Render (https://render.com).
# Sobe a API + páginas web (vendas e agendamento) e um PostgreSQL.
#
# Após conectar o repo em New + > Blueprint, preencha no painel as variáveis
# marcadas com sync:false (chave do Asaas, etc.).
services:
  - type: web
    name: agenda-barber
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"              # fixa Python 3.12 (wheels disponíveis p/ as libs)
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-barber-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true          # chave JWT gerada automaticamente
      - key: TRIAL_DAYS
        value: "7"
      - key: SEED_DEMO
        value: "true"        # cria a conta demo (demo@agendabarber.com / demo123). Troque p/ false depois.
      - key: PLAN_MENSAL_PRICE
        value: "49.90"
      - key: PLAN_ANUAL_PRICE
        value: "499.00"
      - key: ASAAS_BASE_URL
        value: https://api-sandbox.asaas.com/v3   # troque p/ https://api.asaas.com/v3 em produção
      - key: ASAAS_API_KEY
        sync: false                  # cole sua chave do Asaas no painel
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false                  # (opcional) token p/ validar o webhook
      - key: SUPERADMIN_KEY
        sync: false                  # chave do seu painel de assinantes

databases:
  - name: agenda-barber-db
    plan: free
